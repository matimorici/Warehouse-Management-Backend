spring.application.name=wms

# Conexion a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/wms_db
spring.datasource.username=postgres
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# Flyway se ejecuta ANTES que Hibernate y crea/actualiza el schema.
# ddl-auto=validate solo verifica que las entidades coincidan con lo creado.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Flyway (migraciones de schema — db/migration/V1__create_schema.sql)
# baseline-on-migrate: bases ya existentes (creadas con el viejo wms_schema.sql)
# se marcan como baseline V1 sin recrear nada; las bases vacías se crean solas.
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration