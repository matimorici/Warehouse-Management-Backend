name: CI
on:
  pull_request:
    branches: [main]          # ajustá si tu rama se llama master/develop
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wms
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: wms_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_USERNAME: postgres
      DB_PASSWORD: ci_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B verify